Summary: Send download URLs to a ptinyloadd server
Description:
  ptiny.load is an Android client for ptinyloadd,
  a lightweight server-side downloader inspired by pyLoad.

  Send a URL from your Android device to a Linux server
  and let ptinyloadd handle the download.

  A separately installed and configured ptinyloadd server
  is required.

  Server(linux)
  https://github.com/plustiny/ptinyloadd.git
  Client(Android)
  https://github.com/plustiny/ptiny.load.git

